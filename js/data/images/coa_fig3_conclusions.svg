<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" viewBox="0 0 720 230" role="img" aria-labelledby="fig3title fig3desc" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <title id="fig3title">역추론 결과를 보고하는 네 가지 결론 유형</title><desc id="fig3desc">확인된 사실, 지지되는 가설, 대안 가설, 추가 확인 필요를 네 개의 카드로 표시한다.</desc>
        <rect x="15" y="22" width="330" height="78" rx="12" fill="#dce9df" stroke="#9bb8a5"/><text x="35" y="51" font-size="15" font-weight="700" fill="#24483c">확인된 사실</text><text x="35" y="75" font-size="12" fill="#38584b">측정값과 시험법으로 직접 뒷받침</text>
        <rect x="375" y="22" width="330" height="78" rx="12" fill="#e6eee8" stroke="#9bb8a5"/><text x="395" y="51" font-size="15" font-weight="700" fill="#24483c">지지되는 가설</text><text x="395" y="75" font-size="12" fill="#38584b">복수의 독립적인 결과와 부합</text>
        <rect x="15" y="120" width="330" height="78" rx="12" fill="#f4ead9" stroke="#d2b88b"/><text x="35" y="149" font-size="15" font-weight="700" fill="#6b4c24">대안 가설</text><text x="35" y="173" font-size="12" fill="#765d38">같은 결과를 설명할 다른 원인</text>
        <rect x="375" y="120" width="330" height="78" rx="12" fill="#f0f0ec" stroke="#c9cec7"/><text x="395" y="149" font-size="15" font-weight="700" fill="#414b43">추가 확인 필요</text><text x="395" y="173" font-size="12" fill="#5d675f">판별력이 높은 다음 시험을 제안</text>
      </svg>

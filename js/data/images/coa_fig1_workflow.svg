<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" viewBox="0 0 720 300" role="img" aria-labelledby="fig1title fig1desc" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <title id="fig1title">시험성적서에서 제조공정 가설로 이어지는 분석 흐름</title><desc id="fig1desc">성적서 데이터, 조성 및 구조 분석, 경쟁 가설, 확인시험, 결론의 다섯 단계 흐름도.</desc>
        <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#55776a"/></marker></defs>
        <rect x="18" y="30" width="122" height="76" rx="12" fill="#dce9df" stroke="#719184"/><text x="79" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#203c34">성적서</text><text x="79" y="83" text-anchor="middle" font-size="12" fill="#203c34">측정값·시험법</text>
        <path d="M142 68 H158" stroke="#55776a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="164" y="30" width="122" height="76" rx="12" fill="#e9eee9" stroke="#8da095"/><text x="225" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#203c34">특성 분석</text><text x="225" y="83" text-anchor="middle" font-size="12" fill="#203c34">조성·구조·수분</text>
        <path d="M288 68 H304" stroke="#55776a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="310" y="30" width="122" height="76" rx="12" fill="#f3e9d8" stroke="#b99c70"/><text x="371" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#5a4326">경쟁 가설</text><text x="371" y="83" text-anchor="middle" font-size="12" fill="#5a4326">가능한 공정들</text>
        <path d="M434 68 H450" stroke="#55776a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="456" y="30" width="112" height="76" rx="12" fill="#e9eee9" stroke="#8da095"/><text x="512" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#203c34">확인시험</text><text x="512" y="83" text-anchor="middle" font-size="12" fill="#203c34">가설 구별</text>
        <path d="M570 68 H586" stroke="#55776a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="592" y="30" width="110" height="76" rx="12" fill="#dce9df" stroke="#719184"/><text x="647" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#203c34">결론</text><text x="647" y="83" text-anchor="middle" font-size="12" fill="#203c34">증거 수준 표기</text>
        <path d="M647 110 V160 H371 V120" fill="none" stroke="#a77a43" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="510" y="184" text-anchor="middle" font-size="13" fill="#78572e">결과가 불충분하면 가설을 수정하고 재시험</text>
        <rect x="75" y="218" width="570" height="52" rx="10" fill="#fff" stroke="#d0d9d1"/><text x="360" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#203c34">중요한 원칙</text><text x="360" y="259" text-anchor="middle" font-size="12" fill="#52645a">관찰 사실과 공정 추론을 분리한다</text>
      </svg>

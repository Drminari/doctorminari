        <g fill="#9db9a8" stroke="#527c67" stroke-width="1.4"><circle cx="95" cy="115" r="27"/><circle cx="173" cy="112" r="35"/><circle cx="250" cy="125" r="22"/><circle cx="125" cy="198" r="32"/><circle cx="220" cy="208" r="29"/></g>

        <text x="181" y="258" text-anchor="middle" font-size="13" fill="#53645a">상대적으로 큰 입자 예시</text><text x="539" y="258" text-anchor="middle" font-size="13" fill="#53645a">상대적으로 작은 입자 예시</text><text x="360" y="305" text-anchor="middle" font-size="11" fill="#68776d">개념도이며 실제 측정 데이터 또는 특정 제조공정의 증거가 아님</text>

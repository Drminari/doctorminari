        <title id="fig2title">원료 A와 B의 가상 입자 비교</title><desc id="fig2desc">A는 비교적 큰 입자, B는 더 작은 입자로 표시했으며 그림은 개념 설명용이다.</desc>
        <rect x="18" y="18" width="326" height="274" rx="14" fill="#fff" stroke="#d5ddd6"/><rect x="376" y="18" width="326" height="274" rx="14" fill="#fff" stroke="#d5ddd6"/>
